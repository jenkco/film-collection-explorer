<!DOCTYPE html>
<html lang="en-GB" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Vault - Personal DVD & Blu-Ray Catalog Explorer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.4);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
        .film-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .film-card:hover {
            transform: translateY(-4px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl shadow-md text-white">
                    <i data-lucide="disc" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-indigo-300">
                        CineCatalog Matrix
                    </h1>
                    <p class="text-xs text-slate-400">Filter, Search & Explore Personal DVD & Blu-Ray Collection</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center px-3 py-1.5 bg-slate-800/70 border border-slate-700/60 rounded-lg text-xs text-slate-300">
                    <span id="stat-showing-count" class="font-bold text-indigo-400 mr-1">0</span> of 
                    <span id="stat-total-count" class="font-bold text-slate-200 ml-1">0</span> Movies
                </div>

                <button onclick="openAddMovieModal()" 
                    class="flex items-center space-x-1.5 text-xs font-semibold px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg shadow-md transition">
                    <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                    <span>Add Movie</span>
                </button>

                <button id="btn-reset-filters" onclick="resetFilters()" 
                    class="flex items-center space-x-1.5 text-xs font-medium px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg border border-slate-700 transition">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    <span>Reset Filters</span>
                </button>

                <button onclick="window.print()" 
                    class="hidden md:flex items-center space-x-1.5 text-xs font-medium px-3 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 rounded-lg border border-indigo-500/30 transition">
                    <i data-lucide="printer" class="w-3.5 h-3.5"></i>
                    <span>Export / Print</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Alphabetical Fast Jump Bar -->
        <section class="bg-slate-900/60 border border-slate-800/80 rounded-xl p-3 shadow-inner">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="arrow-down-a-z" class="w-3.5 h-3.5 text-indigo-400"></i> Alphabetical Quick Filter
                </span>
                <span id="active-letter-indicator" class="text-xs text-indigo-400 font-medium">All Letters</span>
            </div>
            <div id="alphabet-bar" class="flex flex-wrap gap-1 justify-center sm:justify-start">
                <!-- JS will inject A-Z buttons -->
            </div>
        </section>

        <!-- Search and Multi-Filter Controls -->
        <section class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 sm:p-5 shadow-xl space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                <!-- Search Input -->
                <div class="md:col-span-4 relative">
                    <label for="search-input" class="block text-xs font-semibold text-slate-300 mb-1">Search Title, Actor, Genre or Format</label>
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-input" placeholder="e.g. Dune, Blu-Ray, Tom Hanks..." 
                            class="w-full bg-slate-950 border border-slate-700/80 rounded-lg pl-9 pr-8 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                        <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Format Selector (DVD / Blu-Ray / Apple Stream) -->
                <div class="md:col-span-2">
                    <label for="format-select" class="block text-xs font-semibold text-slate-300 mb-1">Format</label>
                    <div class="relative">
                        <select id="format-select" onchange="applyFilters()"
                            class="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition appearance-none cursor-pointer">
                            <option value="">All Formats</option>
                            <option value="Blu-Ray">Blu-Ray</option>
                            <option value="DVD">DVD</option>
                            <option value="Apple Stream">Apple Stream</option>
                        </select>
                        <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Genre Selector -->
                <div class="md:col-span-2">
                    <label for="genre-select" class="block text-xs font-semibold text-slate-300 mb-1">Genre</label>
                    <div class="relative">
                        <select id="genre-select" onchange="applyFilters()" 
                            class="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition appearance-none cursor-pointer">
                            <option value="">All Genres</option>
                        </select>
                        <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Lead Actor Selector -->
                <div class="md:col-span-2">
                    <label for="actor-select" class="block text-xs font-semibold text-slate-300 mb-1">Lead Actor</label>
                    <div class="relative">
                        <select id="actor-select" onchange="applyFilters()" 
                            class="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition appearance-none cursor-pointer">
                            <option value="">All Lead Actors</option>
                        </select>
                        <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Sort Selector -->
                <div class="md:col-span-2">
                    <label for="sort-select" class="block text-xs font-semibold text-slate-300 mb-1">Sort By</label>
                    <div class="relative">
                        <select id="sort-select" onchange="applyFilters()" 
                            class="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition appearance-none cursor-pointer">
                            <option value="title-asc">Title (A-Z)</option>
                            <option value="title-desc">Title (Z-A)</option>
                            <option value="actor-asc">Lead Actor (A-Z)</option>
                            <option value="genre-asc">Primary Genre (A-Z)</option>
                            <option value="year-desc">Release Year (Newest)</option>
                            <option value="year-asc">Release Year (Oldest)</option>
                        </select>
                        <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
            </div>

            <!-- Layout View Modes & Tag Bar -->
            <div class="flex flex-wrap items-center justify-between pt-3 border-t border-slate-800/80 gap-3">
                <!-- View Mode Toggle -->
                <div class="flex items-center space-x-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
                    <button id="view-grid-btn" onclick="setViewMode('grid')" title="Grid View"
                        class="px-2.5 py-1 rounded text-xs font-medium flex items-center space-x-1 transition bg-indigo-600 text-white">
                        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                        <span>Grid</span>
                    </button>
                    <button id="view-list-btn" onclick="setViewMode('list')" title="List View"
                        class="px-2.5 py-1 rounded text-xs font-medium flex items-center space-x-1 transition text-slate-400 hover:text-white">
                        <i data-lucide="list" class="w-3.5 h-3.5"></i>
                        <span>Detailed List</span>
                    </button>
                    <button id="view-grouped-btn" onclick="setViewMode('grouped')" title="Grouped by Letter"
                        class="px-2.5 py-1 rounded text-xs font-medium flex items-center space-x-1 transition text-slate-400 hover:text-white">
                        <i data-lucide="folder-tree" class="w-3.5 h-3.5"></i>
                        <span>A-Z Grouped</span>
                    </button>
                </div>

                <!-- Active Filter Badges Container -->
                <div id="active-badges" class="flex flex-wrap items-center gap-2">
                    <!-- Dynamic badges go here -->
                </div>
            </div>
        </section>

        <!-- Movie Display Container -->
        <section id="movie-container" class="space-y-6 min-h-[400px]">
            <!-- Dynamic content injected here -->
        </section>

    </main>

    <!-- Detailed Movie Modal -->
    <div id="movie-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative overflow-hidden transform scale-95 transition-transform duration-200" id="modal-card">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1 rounded-lg bg-slate-800/50 hover:bg-slate-800 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div id="modal-content">
                <!-- Modal details rendered dynamically -->
            </div>
        </div>
    </div>

    <!-- Add New Movie Modal -->
    <div id="add-movie-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative overflow-hidden transform scale-95 transition-transform duration-200" id="add-modal-card">
            <button onclick="closeAddMovieModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1 rounded-lg bg-slate-800/50 hover:bg-slate-800 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <i data-lucide="disc" class="w-5 h-5 text-indigo-400"></i>
                Add New Movie to Vault
            </h2>

            <form id="add-movie-form" onsubmit="handleAddMovieSubmit(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-300 font-semibold mb-1">Movie Title *</label>
                    <input type="text" id="add-title" required placeholder="e.g. Inception"
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-slate-300 font-semibold mb-1">Lead Actor *</label>
                    <input type="text" id="add-actor" required placeholder="e.g. Leonardo DiCaprio"
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-slate-300 font-semibold mb-1">Format(s) * <span class="text-slate-500 font-normal">(tick all that apply)</span></label>
                    <div class="flex flex-wrap gap-4 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5">
                        <label class="flex items-center gap-1.5 text-slate-200 cursor-pointer select-none">
                            <input type="checkbox" class="add-format-checkbox accent-indigo-500" value="DVD"> DVD
                        </label>
                        <label class="flex items-center gap-1.5 text-slate-200 cursor-pointer select-none">
                            <input type="checkbox" class="add-format-checkbox accent-indigo-500" value="Blu-Ray"> Blu-Ray
                        </label>
                        <label class="flex items-center gap-1.5 text-slate-200 cursor-pointer select-none">
                            <input type="checkbox" class="add-format-checkbox accent-indigo-500" value="Apple Stream"> Apple Stream
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-300 font-semibold mb-1">Primary Genre *</label>
                        <input type="text" id="add-genre1" required placeholder="e.g. Sci-Fi"
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-slate-300 font-semibold mb-1">Secondary Genre (Optional)</label>
                        <input type="text" id="add-genre2" placeholder="e.g. Action"
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-300 font-semibold mb-1">Release Year *</label>
                        <input type="text" id="add-year" required placeholder="e.g. 2010"
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-slate-300 font-semibold mb-1">Accent Theme</label>
                        <select id="add-accent"
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500">
                            <option value="from-blue-800 to-indigo-950">Blue / Indigo</option>
                            <option value="from-sky-800 to-slate-950">Sky / Slate</option>
                            <option value="from-amber-800 to-slate-950">Amber / Slate</option>
                            <option value="from-emerald-800 to-slate-950">Emerald / Green</option>
                            <option value="from-red-900 to-slate-950">Red / Crimson</option>
                            <option value="from-purple-900 to-slate-950">Purple / Violet</option>
                        </select>
                    </div>
                </div>

                <div class="pt-3 flex justify-end gap-2">
                    <button type="button" onclick="closeAddMovieModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-lg transition">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-md transition">
                        Save Movie
                    </button>
                </div>
            </form>
        </div>
    </div>

        ];

        let currentLetterFilter = null;
        let currentViewMode = 'grid'; // 'grid', 'list', 'grouped'

        // Badge styling per format, shared across grid/list/grouped/modal views
        const FORMAT_STYLES = {
            'Blu-Ray': { badge: 'bg-sky-500/20 text-sky-300 border-sky-400/40', badgeStrong: 'bg-sky-500/30 text-sky-200 border-sky-400/50', text: 'text-sky-400' },
            'DVD': { badge: 'bg-amber-500/20 text-amber-300 border-amber-400/40', badgeStrong: 'bg-amber-500/30 text-amber-200 border-amber-400/50', text: 'text-amber-400' },
            'Apple Stream': { badge: 'bg-violet-500/20 text-violet-300 border-violet-400/40', badgeStrong: 'bg-violet-500/30 text-violet-200 border-violet-400/50', text: 'text-violet-400' },
        };
        function getFormatStyle(format) {
            return FORMAT_STYLES[format] || FORMAT_STYLES['DVD'];
        }
        function formatBadges(formats, variant) {
            const key = variant === 'strong' ? 'badgeStrong' : 'badge';
            return formats.map(f => `<span class="text-[10px] font-bold px-2 py-0.5 rounded border backdrop-blur-sm ${getFormatStyle(f)[key]}">${f}</span>`).join(' ');
        }

        // Utility: Strip leading "The " or "A " for proper alphabetical sorting
        function getSortTitle(title) {
            return title.replace(/^(The|A|An)\s+/i, '');
        }

        // Initialize UI component options
        function initControls() {
            // Extract unique genres
            const genreSet = new Set();
            movies.forEach(m => m.genres.forEach(g => genreSet.add(g)));
            const genres = Array.from(genreSet).sort();

            const genreSelect = document.getElementById('genre-select');
            const selectedGenre = genreSelect.value;
            genreSelect.innerHTML = '<option value="">All Genres</option>';
            genres.forEach(g => {
                const count = movies.filter(m => m.genres.includes(g)).length;
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = `${g} (${count})`;
                genreSelect.appendChild(opt);
            });
            genreSelect.value = selectedGenre;

            // Extract unique actors
            const actorSet = new Set();
            movies.forEach(m => actorSet.add(m.actor));
            const actors = Array.from(actorSet).sort();

            const actorSelect = document.getElementById('actor-select');
            const selectedActor = actorSelect.value;
            actorSelect.innerHTML = '<option value="">All Lead Actors</option>';
            actors.forEach(a => {
                const count = movies.filter(m => m.actor === a).length;
                const opt = document.createElement('option');
                opt.value = a;
                opt.textContent = `${a} (${count})`;
                actorSelect.appendChild(opt);
            });
            actorSelect.value = selectedActor;

            const alphabetBar = document.getElementById('alphabet-bar');
            alphabetBar.innerHTML = '';

            // Add "ALL" button
            const allBtn = document.createElement('button');
            allBtn.className = `px-2 py-1 text-xs font-bold rounded transition ${currentLetterFilter === null ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
            allBtn.textContent = 'ALL';
            allBtn.onclick = () => selectLetter(null);
            alphabetBar.appendChild(allBtn);

            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            letters.forEach(letter => {
                const hasMovies = movies.some(m => getSortTitle(m.title).toUpperCase().startsWith(letter));
                const btn = document.createElement('button');
                
                let btnStyle = "px-2 py-1 text-xs font-semibold rounded transition ";
                if (currentLetterFilter === letter) {
                    btnStyle += "bg-indigo-600 text-white shadow-md";
                } else if (hasMovies) {
                    btnStyle += "bg-slate-800 text-slate-200 hover:bg-indigo-900/50 hover:text-indigo-300 border border-slate-700/60";
                } else {
                    btnStyle += "bg-slate-900/40 text-slate-600 cursor-not-allowed border border-slate-800/40";
                    btn.disabled = true;
                }
                
                btn.className = btnStyle;
                btn.textContent = letter;
                btn.onclick = () => selectLetter(letter);
                alphabetBar.appendChild(btn);
            });

            // Search listener
            const searchInput = document.getElementById('search-input');
            searchInput.removeEventListener('input', handleSearchInput);
            searchInput.addEventListener('input', handleSearchInput);
        }

        function handleSearchInput(e) {
            document.getElementById('clear-search').classList.toggle('hidden', !e.target.value);
            applyFilters();
        }

        function getFilteredMovies() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            const genreFilter = document.getElementById('genre-select').value;
            const actorFilter = document.getElementById('actor-select').value;
            const formatFilter = document.getElementById('format-select').value;
            const sortBy = document.getElementById('sort-select').value;

            return movies.filter(m => {
                // Search match across Title, Lead Actor, Genres, and Format
                const matchSearch = !searchQuery ||
                    m.title.toLowerCase().includes(searchQuery) ||
                    m.actor.toLowerCase().includes(searchQuery) ||
                    m.formats.some(f => f.toLowerCase().includes(searchQuery)) ||
                    m.genres.some(g => g.toLowerCase().includes(searchQuery));

                // Format match
                const matchFormat = !formatFilter || m.formats.includes(formatFilter);

                // Genre match
                const matchGenre = !genreFilter || m.genres.includes(genreFilter);

                // Actor match
                const matchActor = !actorFilter || m.actor === actorFilter;

                // Letter match
                const matchLetter = !currentLetterFilter || getSortTitle(m.title).toUpperCase().startsWith(currentLetterFilter);

                return matchSearch && matchFormat && matchGenre && matchActor && matchLetter;
            }).sort((a, b) => {
                if (sortBy === 'title-asc') {
                    return getSortTitle(a.title).localeCompare(getSortTitle(b.title));
                } else if (sortBy === 'title-desc') {
                    return getSortTitle(b.title).localeCompare(getSortTitle(a.title));
                } else if (sortBy === 'actor-asc') {
                    return a.actor.localeCompare(b.actor);
                } else if (sortBy === 'genre-asc') {
                    return a.genres[0].localeCompare(b.genres[0]);
                } else if (sortBy === 'year-desc') {
                    return String(b.year).localeCompare(String(a.year));
                } else if (sortBy === 'year-asc') {
                    return String(a.year).localeCompare(String(b.year));
                }
                return 0;
            });
        }

        function updateActiveBadges() {
            const container = document.getElementById('active-badges');
            container.innerHTML = '';

            const genreFilter = document.getElementById('genre-select').value;
            const actorFilter = document.getElementById('actor-select').value;
            const formatFilter = document.getElementById('format-select').value;
            const searchQuery = document.getElementById('search-input').value.trim();

            if (formatFilter) {
                container.appendChild(createBadge(`Format: ${formatFilter}`, () => {
                    document.getElementById('format-select').value = '';
                    applyFilters();
                }));
            }
            if (genreFilter) {
                container.appendChild(createBadge(`Genre: ${genreFilter}`, () => {
                    document.getElementById('genre-select').value = '';
                    applyFilters();
                }));
            }
            if (actorFilter) {
                container.appendChild(createBadge(`Actor: ${actorFilter}`, () => {
                    document.getElementById('actor-select').value = '';
                    applyFilters();
                }));
            }
            if (currentLetterFilter) {
                container.appendChild(createBadge(`Letter: ${currentLetterFilter}`, () => {
                    selectLetter(null);
                }));
            }
            if (searchQuery) {
                container.appendChild(createBadge(`Search: "${searchQuery}"`, () => {
                    clearSearch();
                }));
            }
        }

        function createBadge(text, onRemove) {
            const badge = document.createElement('span');
            badge.className = "inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs bg-indigo-900/50 text-indigo-200 border border-indigo-700/50 shadow-sm";
            badge.innerHTML = `<span>${text}</span>`;
            
            const closeBtn = document.createElement('button');
            closeBtn.className = "hover:text-white transition ml-0.5";
            closeBtn.innerHTML = '<i data-lucide="x" class="w-3 h-3"></i>';
            closeBtn.onclick = onRemove;
            
            badge.appendChild(closeBtn);
            return badge;
        }

        function renderMovies() {
            const filtered = getFilteredMovies();
            const container = document.getElementById('movie-container');
            
            // Update statistics
            document.getElementById('stat-showing-count').textContent = filtered.length;
            document.getElementById('stat-total-count').textContent = movies.length;
            updateActiveBadges();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-slate-900/40 rounded-2xl border border-slate-800">
                        <i data-lucide="film" class="w-12 h-12 mx-auto text-slate-600 mb-3"></i>
                        <h3 class="text-lg font-semibold text-slate-300">No movies found</h3>
                        <p class="text-xs text-slate-500 max-w-sm mx-auto mt-1 mb-4">Try adjusting your filters, clearing your search query, or selecting another letter.</p>
                        <button onclick="resetFilters()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-lg transition shadow-md">
                            Reset All Filters
                        </button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            if (currentViewMode === 'grid') {
                renderGridView(filtered, container);
            } else if (currentViewMode === 'list') {
                renderListView(filtered, container);
            } else if (currentViewMode === 'grouped') {
                renderGroupedView(filtered, container);
            }

            lucide.createIcons();
        }

        function renderGridView(items, container) {
            let html = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5">`;
            
            items.forEach(m => {
                html += `
                    <div onclick="openModal(${m.id})" class="film-card bg-slate-900 border border-slate-800 rounded-xl overflow-hidden cursor-pointer flex flex-col justify-between group shadow-lg hover:border-indigo-500/50 hover:shadow-indigo-500/10">
                        <!-- Top Mini Poster Banner -->
                        <div class="h-28 bg-gradient-to-br ${m.accent} relative p-4 flex flex-col justify-between overflow-hidden">
                            <div class="absolute -right-4 -bottom-4 opacity-15 transform rotate-12 group-hover:scale-110 transition duration-300">
                                <i data-lucide="disc" class="w-24 h-24 text-white"></i>
                            </div>
                            <div class="flex items-center justify-between z-10">
                                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-black/40 backdrop-blur-md text-white/90 border border-white/10">
                                    ${m.year}
                                </span>
                                <span class="flex flex-wrap gap-1 justify-end">
                                    ${formatBadges(m.formats)}
                                </span>
                            </div>
                            <i data-lucide="play-circle" class="w-8 h-8 text-white/70 group-hover:text-white group-hover:scale-110 transition z-10"></i>
                        </div>

                        <!-- Card Body -->
                        <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                            <div>
                                <h3 class="font-bold text-slate-100 text-base leading-snug group-hover:text-indigo-400 transition line-clamp-2">
                                    ${m.title}
                                </h3>
                                <p class="text-xs text-slate-400 flex items-center gap-1.5 mt-1">
                                    <i data-lucide="user" class="w-3.5 h-3.5 text-indigo-400 flex-shrink-0"></i>
                                    <span class="truncate">${m.actor}</span>
                                </p>
                            </div>

                            <!-- Genre Badges -->
                            <div class="flex flex-wrap gap-1 pt-1">
                                ${m.genres.map(g => `<span onclick="filterByGenre('${g}', event)" class="text-[10px] px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700/60 transition">${g}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function renderListView(items, container) {
            let html = `
                <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-300">
                            <thead class="bg-slate-950 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-800">
                                <tr>
                                    <th class="py-3.5 px-4">Title</th>
                                    <th class="py-3.5 px-4">Format</th>
                                    <th class="py-3.5 px-4">Lead Actor</th>
                                    <th class="py-3.5 px-4">Genre(s)</th>
                                    <th class="py-3.5 px-4 text-center">Year</th>
                                    <th class="py-3.5 px-4 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/60">
            `;

            items.forEach(m => {
                html += `
                    <tr class="hover:bg-slate-800/50 transition cursor-pointer group" onclick="openModal(${m.id})">
                        <td class="py-3 px-4 font-semibold text-slate-100 group-hover:text-indigo-400">
                            ${m.title}
                        </td>
                        <td class="py-3 px-4">
                            <div class="flex flex-wrap gap-1">${formatBadges(m.formats)}</div>
                        </td>
                        <td class="py-3 px-4 text-slate-300 flex items-center gap-2">
                            <i data-lucide="user" class="w-3.5 h-3.5 text-indigo-400 flex-shrink-0"></i>
                            <span onclick="filterByActor('${m.actor}', event)" class="hover:underline hover:text-white">${m.actor}</span>
                        </td>
                        <td class="py-3 px-4">
                            <div class="flex flex-wrap gap-1">
                                ${m.genres.map(g => `<span onclick="filterByGenre('${g}', event)" class="text-[10px] px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700/50 transition">${g}</span>`).join('')}
                            </div>
                        </td>
                        <td class="py-3 px-4 text-center text-xs font-medium text-slate-400">
                            ${m.year}
                        </td>
                        <td class="py-3 px-4 text-right">
                            <button class="text-xs px-2.5 py-1 bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white rounded border border-slate-700 transition">
                                Details
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function renderGroupedView(items, container) {
            // Group items by letter
            const groups = {};
            items.forEach(m => {
                const letter = getSortTitle(m.title).charAt(0).toUpperCase();
                if (!groups[letter]) groups[letter] = [];
                groups[letter].push(m);
            });

            const sortedLetters = Object.keys(groups).sort();
            let html = `<div class="space-y-6">`;

            sortedLetters.forEach(letter => {
                html += `
                    <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 sm:p-5 shadow-md">
                        <div class="flex items-center space-x-3 mb-4 border-b border-slate-800 pb-2">
                            <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white font-bold flex items-center justify-center text-base shadow-md">
                                ${letter}
                            </div>
                            <span class="text-xs font-medium text-slate-400">${groups[letter].length} Title${groups[letter].length > 1 ? 's' : ''}</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                `;

                groups[letter].forEach(m => {
                    const formatTags = m.formats.map(f => `<span class="text-[9px] font-bold ${getFormatStyle(f).text}">[${f}]</span>`).join(' ');
                    html += `
                        <div onclick="openModal(${m.id})" class="p-3 bg-slate-950/60 hover:bg-slate-800/80 border border-slate-800 hover:border-indigo-500/40 rounded-lg cursor-pointer transition flex justify-between items-center group">
                            <div>
                                <h4 class="font-semibold text-xs text-slate-200 group-hover:text-indigo-300 transition line-clamp-1">${m.title}</h4>
                                <p class="text-[11px] text-slate-400 mt-0.5 flex items-center gap-1.5 flex-wrap">
                                    <span>${m.actor}</span>
                                    ${formatTags}
                                </p>
                            </div>
                            <span class="text-[10px] text-slate-500 font-mono pl-2">${m.year}</span>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function filterByGenre(genre, event) {
            if (event) event.stopPropagation();
            document.getElementById('genre-select').value = genre;
            applyFilters();
        }

        function filterByActor(actor, event) {
            if (event) event.stopPropagation();
            document.getElementById('actor-select').value = actor;
            applyFilters();
        }

        function selectLetter(letter) {
            currentLetterFilter = letter;
            initControls();
            applyFilters();
        }

        function applyFilters() {
            renderMovies();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search').classList.add('hidden');
            applyFilters();
        }

        function resetFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search').classList.add('hidden');
            document.getElementById('format-select').value = '';
            document.getElementById('genre-select').value = '';
            document.getElementById('actor-select').value = '';
            document.getElementById('sort-select').value = 'title-asc';
            currentLetterFilter = null;
            initControls();
            applyFilters();
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            
            ['grid', 'list', 'grouped'].forEach(m => {
                const btn = document.getElementById(`view-${m}-btn`);
                if (m === mode) {
                    btn.className = "px-2.5 py-1 rounded text-xs font-medium flex items-center space-x-1 transition bg-indigo-600 text-white shadow-sm";
                } else {
                    btn.className = "px-2.5 py-1 rounded text-xs font-medium flex items-center space-x-1 transition text-slate-400 hover:text-white";
                }
            });

            renderMovies();
        }

        // Add Movie Manual Functionality
        function openAddMovieModal() {
            const modal = document.getElementById('add-movie-modal');
            const card = document.getElementById('add-modal-card');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
            }, 10);
        }

        function closeAddMovieModal() {
            const modal = document.getElementById('add-movie-modal');
            const card = document.getElementById('add-modal-card');
            modal.classList.add('opacity-0');
            card.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('add-movie-form').reset();
            }, 200);
        }

        function handleAddMovieSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('add-title').value.trim();
            const actor = document.getElementById('add-actor').value.trim();
            const formats = Array.from(document.querySelectorAll('.add-format-checkbox:checked')).map(cb => cb.value);
            const genre1 = document.getElementById('add-genre1').value.trim();
            const genre2 = document.getElementById('add-genre2').value.trim();
            const year = document.getElementById('add-year').value.trim();
            const accent = document.getElementById('add-accent').value;

            if (!title || !actor || !genre1 || !year || formats.length === 0) return;

            const genres = [genre1];
            if (genre2) genres.push(genre2);

            const newMovie = {
                id: Date.now(),
                title,
                actor,
                genres,
                formats,
                year,
                accent
            };

            movies.push(newMovie);
            initControls();
            applyFilters();
            closeAddMovieModal();
        }

        function openModal(movieId) {
            const movie = movies.find(m => m.id === movieId);
            if (!movie) return;

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="space-y-4">
                    <div class="p-4 rounded-xl bg-gradient-to-br ${movie.accent} text-white shadow-inner relative">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-black/40 border border-white/20">
                                Released: ${movie.year}
                            </span>
                            <span class="flex flex-wrap gap-1 justify-end">
                                ${formatBadges(movie.formats, 'strong')}
                            </span>
                        </div>
                        <h2 class="text-xl font-black mt-2 leading-tight">${movie.title}</h2>
                    </div>

                    <div class="space-y-3 text-xs text-slate-300">
                        <div class="flex items-start gap-2">
                            <i data-lucide="user" class="w-4 h-4 text-indigo-400 mt-0.5"></i>
                            <div>
                                <span class="text-slate-400 block font-medium">Lead Actor / Cast:</span>
                                <span class="font-semibold text-slate-100 text-sm">${movie.actor}</span>
                            </div>
                        </div>

                        <div class="flex items-start gap-2">
                            <i data-lucide="disc" class="w-4 h-4 text-indigo-400 mt-0.5"></i>
                            <div>
                                <span class="text-slate-400 block font-medium">Available Format(s):</span>
                                <div class="flex flex-wrap gap-1 mt-1">${formatBadges(movie.formats)}</div>
                            </div>
                        </div>

                        <div class="flex items-start gap-2">
                            <i data-lucide="tags" class="w-4 h-4 text-indigo-400 mt-0.5"></i>
                            <div>
                                <span class="text-slate-400 block font-medium mb-1">Genres:</span>
                                <div class="flex flex-wrap gap-1">
                                    ${movie.genres.map(g => `<span class="px-2 py-0.5 bg-slate-800 text-indigo-300 rounded border border-slate-700">${g}</span>`).join('')}
                                </div>
                            </div>
                        </div>

                        <div class="p-3 bg-slate-950/80 rounded-lg border border-slate-800 mt-3">
                            <span class="text-slate-400 font-medium block mb-1">Collection Metadata:</span>
                            <p class="text-[11px] text-slate-400 leading-relaxed">
                                Title indexed under <strong>${getSortTitle(movie.title).charAt(0).toUpperCase()}</strong> in combined alphabetical list.
                            </p>
                        </div>
                    </div>

                    <div class="pt-2 flex justify-end">
                        <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg transition">
                            Close
                        </button>
                    </div>
                </div>
            `;

            lucide.createIcons();
            const modal = document.getElementById('movie-modal');
            const card = document.getElementById('modal-card');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('movie-modal');
            const card = document.getElementById('modal-card');
            modal.classList.add('opacity-0');
            card.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // Close modal when clicking backdrop
        document.getElementById('movie-modal').addEventListener('click', (e) => {
            if (e.target.id === 'movie-modal') closeModal();
        });
        document.getElementById('add-movie-modal').addEventListener('click', (e) => {
            if (e.target.id === 'add-movie-modal') closeAddMovieModal();
        });

        // Initialize App on DOM Load
        window.onload = function() {
            initControls();
            renderMovies();
        };
    </script>
</body>
</html>
